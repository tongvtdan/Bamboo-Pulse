name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./script/build_and_run.sh --preview --test
      - run: ./script/build_and_run.sh --live --test
      - run: ./script/build_and_run.sh --release --build-only
